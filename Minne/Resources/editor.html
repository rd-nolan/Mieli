<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minne Editor</title>
  <!--
    Minne Markdown editor host page (T060 container) + Milkdown WYSIWYG (T061).
    AGENTS §8: Markdown is the single source of truth — the frontend serializes
    the editor back to Markdown for storage (see frontend/src/index.js).

    Swift drives this page through the EditorBridge (AGENTS §16); all calls go
    through window.minneEditor, never loose evaluateJavaScript.
  -->
  <link rel="stylesheet" href="editor.bundle.css">
  <style>
    body {
      margin: 0;
      padding: 4px 24px 24px;
      font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif;
    }
    #editor {
      width: 100%;
      min-height: 70vh;
    }
    /* Selected text: neutral, borderless highlight (no blue outline). */
    ::selection {
      background-color: rgba(120, 120, 120, 0.22);
      color: inherit;
    }

/* ProseMirror draws a blue outline around a selected node — remove it so
       框选正文时不出现蓝色边框. */
    .ProseMirror-selectednode { outline: none; }
    li.ProseMirror-selectednode::after { display: none; }

    /* The editor shows a macOS-blue (#005fcc) focus ring around the whole
       editable area whenever the caret is inside (`.ProseMirror-focused`).
       Remove it so hovering the content never draws a blue box. */
    .ProseMirror,
    .ProseMirror-focused,
    .ProseMirror:focus,
    .ProseMirror:focus-visible {
      outline: none !important;
      box-shadow: none !important;
    }

    /* Clear heading hierarchy — the Milkdown theme leaves h1-h6 identical to
       body text, so titles have no visual distinction. Give them a macOS-
       native ladder so `#`, `##`, `###`… look different in size. */
    .ProseMirror h1 {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      margin: 1.2em 0 0.5em;
    }
    .ProseMirror h2 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      margin: 1.1em 0 0.45em;
    }
    .ProseMirror h3 {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.35;
      margin: 1em 0 0.4em;
    }
    .ProseMirror h4 {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      margin: 0.9em 0 0.35em;
    }
    .ProseMirror h5 {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.45;
      margin: 0.8em 0 0.3em;
    }
    .ProseMirror h6 {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
      margin: 0.8em 0 0.3em;
      color: #4a4a4a;
    }

    /* Block-type labels live outside the document flow, so they clarify the
       WYSIWYG structure without ever becoming Markdown content. Only top-level
       blocks receive labels; nested lists and quotes keep the canvas quiet. */
    .ProseMirror > h1,
    .ProseMirror > h2,
    .ProseMirror > h3,
    .ProseMirror > h4,
    .ProseMirror > h5,
    .ProseMirror > h6,
    .ProseMirror > blockquote,
    .ProseMirror > pre,
    .ProseMirror > ul,
    .ProseMirror > ol,
    .ProseMirror > [data-table-wrapper="true"],
    .ProseMirror > hr {
      position: relative;
    }
    .ProseMirror > h1::before,
    .ProseMirror > h2::before,
    .ProseMirror > h3::before,
    .ProseMirror > h4::before,
    .ProseMirror > h5::before,
    .ProseMirror > h6::before,
    .ProseMirror > blockquote::before,
    .ProseMirror > pre::before,
    .ProseMirror > ul::before,
    .ProseMirror > ol::before,
    .ProseMirror > [data-table-wrapper="true"]::before,
    .ProseMirror > hr::before {
      display: block;
      position: absolute;
      top: 0.15em;
      right: calc(100% + 0.55em);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.08em;
      color: rgba(60, 60, 67, 0.48);
      writing-mode: vertical-rl;
      text-orientation: upright;
      pointer-events: none;
      user-select: none;
    }
    .ProseMirror > h1::before { content: "H1"; }
    .ProseMirror > h2::before { content: "H2"; }
    .ProseMirror > h3::before { content: "H3"; }
    .ProseMirror > h4::before { content: "H4"; }
    .ProseMirror > h5::before { content: "H5"; }
    .ProseMirror > h6::before { content: "H6"; }
    .ProseMirror > blockquote::before { content: "引用"; }
    .ProseMirror > ul::before { content: "无序列表"; }
    .ProseMirror > ol::before { content: "有序列表"; }
    .ProseMirror > ul:has(> li[data-task-item])::before { content: "任务列表"; }
    .ProseMirror > [data-table-wrapper="true"]::before { content: "表格"; }
    .ProseMirror > hr::before { content: "分隔线"; }

    /* Don't let the first heading's margin-top collapse into the editor's top
       edge, which adds phantom whitespace above the content. */
    .ProseMirror > :first-child {
      margin-top: 0;
    }

    /* Milkdown's base reset removes native list markers. Restore semantic
       markers and enough indentation to make nested structure obvious. */
    .ProseMirror ul {
      list-style: disc outside !important;
      padding-left: 1.6em;
      margin: 0.5em 0;
    }
    .ProseMirror ol {
      list-style: decimal outside !important;
      padding-left: 1.8em;
      margin: 0.5em 0;
    }
    .ProseMirror ul ul { list-style-type: circle !important; }
    .ProseMirror ul ul ul { list-style-type: square !important; }
    .ProseMirror li { margin: 0.18em 0; }

    .ProseMirror blockquote {
      margin: 0.7em 0;
      padding: 0.15em 0 0.15em 0.9em;
      border-left: 3px solid rgba(94, 129, 172, 0.65);
      color: rgba(0, 0, 0, 0.68);
    }
    .ProseMirror blockquote blockquote {
      margin-left: 0.55em;
      border-left-color: rgba(94, 129, 172, 0.35);
    }

    .ProseMirror pre {
      margin: 0.8em 0;
      padding: 2.15em 0.9em 0.75em;
      border: 1px solid rgba(60, 60, 67, 0.12);
      border-radius: 8px;
      background: rgba(118, 118, 128, 0.10);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 0.92em;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow: visible;
      tab-size: 4;
    }
    .ProseMirror pre::before {
      content: "代码块";
    }
    .ProseMirror pre[data-language="mermaid"]::before {
      content: "Mermaid";
      text-orientation: mixed;
    }
    .ProseMirror pre::after {
      content: "⌘ Return 跳出";
      position: absolute;
      top: 0.65em;
      right: 0.9em;
      color: rgba(60, 60, 67, 0.42);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.72em;
      font-weight: 500;
      line-height: 1.55;
      pointer-events: none;
      user-select: none;
    }
    .ProseMirror pre code {
      display: block;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
    }

    .ProseMirror :not(pre) > code {
      padding: 0.12em 0.32em;
      border-radius: 4px;
      background: rgba(127, 127, 127, 0.13);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 0.92em;
    }

    .ProseMirror table {
      width: 100%;
      margin: 0;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .ProseMirror > [data-table-wrapper="true"] {
      margin: 0.8em 0;
    }
    .ProseMirror th,
    .ProseMirror td {
      min-width: 5em;
      padding: 0.45em 0.6em;
      border: 1px solid rgba(127, 127, 127, 0.35);
      text-align: left;
      vertical-align: top;
    }
    .ProseMirror tr:first-child td {
      background: rgba(127, 127, 127, 0.1);
      font-weight: 600;
    }

    .ProseMirror li[data-task-item] {
      list-style: none !important;
      display: flex;
      align-items: flex-start;
      gap: 0.45em;
      margin-left: -1.35em;
    }
    .ProseMirror li[data-task-item] > input[type="checkbox"] {
      flex: 0 0 auto;
      margin-top: 0.32em;
    }
    .ProseMirror li[data-task-item] > .task-content {
      min-width: 0;
      flex: 1;
    }
    .ProseMirror li[data-task-item] > .task-content > p:first-child {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <!-- Milkdown mounts editor into rootCtx target.#editor. -->
  <div id="editor"></div>
  <script src="editor.bundle.js"></script>
</body>
</html>
